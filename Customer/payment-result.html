<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCash Payment | Jolie's Pizza</title>
    <link rel="stylesheet" href="customer-header.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #fff8f8;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 520px);
            padding: 36px;
            border: 1px solid #e8e8e8;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #fff0f1;
            color: #d71920;
            font-size: 28px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            color: #59606b;
            line-height: 1.6;
        }

        #orderReference {
            color: #222;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        a {
            min-height: 44px;
            margin-top: 14px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #d71920;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="../shared/responsive.css">
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">₱</div>
        <h1 id="resultHeading">Checking your GCash payment</h1>
        <p id="resultMessage" role="status">
            PayMongo is processing the return from checkout. Your payment is not
            considered paid until our server confirms it.
        </p>
        <p>Order reference: <span id="orderReference">Unavailable</span></p>
        <a href="my orders.html">View My Orders</a>
        <a href="menus.html">Return to Menu</a>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");
        const reference = params.get("reference");
        const heading = document.getElementById("resultHeading");
        const message = document.getElementById("resultMessage");

        document.getElementById("orderReference").textContent =
            reference || "Unavailable";

        if (status === "cancelled") {
            heading.textContent = "GCash checkout was not completed";
            message.textContent =
                "No payment confirmation was received. Your order is saved as unpaid; check My Orders or contact the shop before placing it again.";
        } else {
            heading.textContent = "Payment submitted for verification";
            message.textContent =
                "This page does not confirm payment. PayMongo will notify our server, and the order will show as paid only after that verification.";
        }
    </script>
    <script src="../shared/site-config.js?v=3" defer></script>
</body>
</html>
